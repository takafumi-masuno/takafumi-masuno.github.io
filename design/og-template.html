<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{font-family:Inter,Arial,sans-serif;background:#0b1020;color:#e2e8f0;position:relative}
  .blob{position:absolute;border-radius:9999px;filter:blur(90px)}
  .b1{width:560px;height:560px;left:-160px;top:-200px;background:rgb(99 102 241 / .45)}
  .b2{width:620px;height:620px;right:-200px;bottom:-260px;background:rgb(34 211 238 / .3)}
  .dots{position:absolute;inset:0;background-image:radial-gradient(#1f2a44 1.5px,transparent 1.5px);background-size:28px 28px;mask-image:radial-gradient(ellipse at center,black,transparent 75%)}
  .wrap{position:absolute;inset:0;padding:0 96px;display:flex;flex-direction:column;justify-content:center}
  .role{font-size:34px;font-weight:500;color:#818cf8}
  .role span{color:#94a3b8}
  h1{margin:18px 0 0;font-size:112px;line-height:1.05;font-weight:700;letter-spacing:-.02em;background:linear-gradient(120deg,#818cf8,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
  .url{margin-top:44px;font-size:28px;color:#94a3b8}
</style></head>
<body><div class="blob b1"></div><div class="blob b2"></div><div class="dots"></div>
<div class="wrap"><div class="role">Frontend Engineer <span>/ React · TypeScript</span></div>
<h1>Takafumi Masuno</h1><div class="url">takafumi-masuno.github.io</div></div></body></html>
